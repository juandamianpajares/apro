name: Deploy to GCP Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'Dockerfile'
      - 'terraform/gcp/**'

env:
  GCP_REGION: us-central1
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build Docker image
        id: build-image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          IMAGE_NAME="${{ env.GCP_REGION }}-docker.pkg.dev/$GCP_PROJECT_ID/${{ vars.PROJECT_NAME }}-$ENVIRONMENT/app:$IMAGE_TAG"
          docker build -t $IMAGE_NAME \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/$GCP_PROJECT_ID/${{ vars.PROJECT_NAME }}-$ENVIRONMENT/app:latest \
            -f Dockerfile .
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push Docker image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/$GCP_PROJECT_ID/${{ vars.PROJECT_NAME }}-$ENVIRONMENT/app:$IMAGE_TAG
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/$GCP_PROJECT_ID/${{ vars.PROJECT_NAME }}-$ENVIRONMENT/app:latest

      - name: Deploy to Cloud Run
        id: deploy
        env:
          SERVICE_NAME: ${{ vars.PROJECT_NAME }}-${{ github.event.inputs.environment || 'dev' }}
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          gcloud run services update $SERVICE_NAME \
            --image=$IMAGE \
            --region=${{ env.GCP_REGION }} \
            --platform=managed

      - name: Get service URL
        id: get-url
        env:
          SERVICE_NAME: ${{ vars.PROJECT_NAME }}-${{ github.event.inputs.environment || 'dev' }}
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        env:
          URL: ${{ steps.get-url.outputs.url }}
        run: |
          echo "Waiting for service to be ready..."
          for i in {1..30}; do
            if curl -sf "$URL/api/health" > /dev/null; then
              echo "Service is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Service not ready yet..."
            sleep 10
          done
          echo "Service did not become ready in time"
          exit 1

      - name: Run smoke tests
        env:
          URL: ${{ steps.get-url.outputs.url }}
        run: |
          # Health check
          curl -f "$URL/api/health" || exit 1

          # Basic availability test
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "Service returned HTTP $STATUS"
            exit 1
          fi

      - name: Post deployment summary
        run: |
          echo "### Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Monitor the deployment:" >> $GITHUB_STEP_SUMMARY
          echo "- [Cloud Run Console](https://console.cloud.google.com/run?project=${{ vars.GCP_PROJECT_ID }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Cloud Logging](https://console.cloud.google.com/logs?project=${{ vars.GCP_PROJECT_ID }})" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        if: vars.SLACK_WEBHOOK_URL
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Deployment to GCP ${{ github.event.inputs.environment || 'dev' }}: ${{ needs.deploy.result }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status:* ${{ needs.deploy.result == 'success' && ':white_check_mark: Success' || ':x: Failed' }}\n*Environment:* ${{ github.event.inputs.environment || 'dev' }}\n*Commit:* <${{ github.event.head_commit.url }}|${{ github.sha }}>"
                  }
                }
              ]
            }
